name: Assemble release ZIP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the temporary ZIP parts
        required: true
        type: string
        default: v0.2.0-dev

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download release parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern '*.zip.part-*' --dir parts
          test "$(find parts -maxdepth 1 -type f -name '*.zip.part-*' | wc -l)" -eq 76
          for i in $(seq 1 76); do
            name=$(printf 'EDK2-Portable-DevKit-0.2.0-dev-windows-x64.zip.part-%03d' "$i")
            test -f "parts/$name"
          done

      - name: Assemble and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assembled
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected_prefix = "EDK2-Portable-DevKit-0.2.0-dev-windows-x64.zip.part-"
          expected_zip = "EDK2-Portable-DevKit-0.2.0-dev-windows-x64.zip"
          expected_size = 315687784
          expected_sha256 = "74db6e3b41e3c51c450f0f3feae16bb849151ec58cc0ead2a68708ae6dfabcb9"

          parts_dir = Path("parts")
          parts = [parts_dir / f"{expected_prefix}{i:03d}" for i in range(1, 77)]
          if any(not path.is_file() for path in parts):
              raise SystemExit("A ZIP part is missing")
          if len(list(parts_dir.glob("*.zip.part-*"))) != 76:
              raise SystemExit("Unexpected ZIP part count")

          output_path = Path("assembled") / expected_zip
          with output_path.open("wb") as output:
              for part in parts:
                  with part.open("rb") as source:
                      while chunk := source.read(1024 * 1024):
                          output.write(chunk)

          digest = sha256(output_path.read_bytes()).hexdigest()
          if output_path.stat().st_size != expected_size:
              raise SystemExit("Assembled ZIP size mismatch")
          if digest != expected_sha256:
              raise SystemExit("Assembled ZIP SHA256 mismatch")

          sidecar = Path("assembled") / (expected_zip + ".sha256")
          sidecar.write_text(f"{digest}  *{expected_zip}\n", encoding="ascii")
          print(f"assembled_size={output_path.stat().st_size}")
          print(f"assembled_sha256={digest}")
          PY

      - name: Upload complete ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "assembled/EDK2-Portable-DevKit-0.2.0-dev-windows-x64.zip" "assembled/EDK2-Portable-DevKit-0.2.0-dev-windows-x64.zip.sha256" --repo "$REPOSITORY" --clobber

      - name: Verify uploaded assets
        shell: bash
        run: |
          set -euo pipefail
          zip_size=$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "EDK2-Portable-DevKit-0.2.0-dev-windows-x64.zip") | .size')
          sha_size=$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "EDK2-Portable-DevKit-0.2.0-dev-windows-x64.zip.sha256") | .size')
          test "$zip_size" -eq 315687784
          test "$sha_size" -gt 0

      - name: Delete temporary ZIP parts
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | startswith("EDK2-Portable-DevKit-0.2.0-dev-windows-x64.zip.part-")) | .id' |
          while read -r asset_id; do
            test -n "$asset_id"
            gh api --method DELETE "repos/$REPOSITORY/releases/assets/$asset_id"
          done